      <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
    </svg>
  ),
  ventas: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
    </svg>
  ),
  ofertas: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
    </svg>
  ),
  ingresos: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
    </svg>
  ),
};

const TABS = [
  { id: 'inicio',   label: 'Inicio'   },
  { id: 'tiendas',  label: 'Tiendas'  },
  { id: 'bodega',   label: 'Bodega'   },
  { id: 'ventas',   label: 'Ventas'   },
  { id: 'ofertas',  label: 'Ofertas'  },
  { id: 'ingresos', label: 'Ingresos' },
];

const TAB_TITLES = {
  inicio:   'Inicio',
  tiendas:  'Mis Tiendas',
  bodega:   'Bodega',
  ventas:   'Ventas',
  ofertas:  'Ofertas',
  ingresos: 'Ingresos',
};

// =============================================
// 11. APP PRINCIPAL
// =============================================
function App() {
  const sesion = (() => {
    try {
      const s = getSession();
      if (!s || s.expires_at <= Date.now() || s.rol !== 'vendedor') { window.location.href = 'index.html'; return null; }
      return s;
    } catch { window.location.href = 'index.html'; return null; }
  })();

  const [loading,   setLoading]   = useState(true);
  const [tab,       setTab]       = useState('inicio');
  const [reportes,  setReportes]  = useState([]);
  const [tareas,    setTareas]    = useState([]);
  const [config,    setConfig]    = useState({});
  const [loadError, setLoadError] = useState(null);
  const [repsMsg,   setRepsMsg]   = useState(null);
  const [conteoTarea, setConteoTarea] = useState(null);

  useEffect(() => {
    if (sesion) refreshSession().then(() => loadData(sesion));
  }, []);

  const loadData = async s => {
    setLoading(true);
    try {
      // 1. Tareas del vendedor — filtrado server-side por vendedor_nombre
      const { data: misTareas } = await sbPortal.from('tareas').select('*').eq('vendedor_nombre', s.nombre);
      setTareas(misTareas || []);

      // 2. Reportes: filtrado server-side + paginación con tope de iteraciones
      let allReps = [];
      let from = 0;
      const pageSize = 200;
      let repsError = null;
      const maxIterations = 10;
      let iterations = 0;
      while (iterations < maxIterations) {
        iterations++;
        const { data, error } = await sbPortal
          .from('reportes')
          .select('*')
          .in('vendedor', [s.nombre, 'MACHETAZO: ' + s.nombre])
          .range(from, from + pageSize - 1);
        if (error) { repsError = error; break; }
        if (!data || data.length === 0) break;
        allReps = allReps.concat(data);
        if (data.length < pageSize) break;
        from += pageSize;
      }
      const reps = allReps;

      if (repsError) {
        console.error('reportes error:', repsError);
        setRepsMsg('No se pudieron cargar los reportes de inventario. Algunos datos pueden no estar disponibles.');
        setReportes([]);
      } else {
        const normNombre = norm(s.nombre);

        const repsConVendedor = reps.map(r => {
          const rawVend    = r.vendedor || '';
          const cleanVend  = rawVend.replace(/^[^:]+:\s*/, '').trim();
          const vendedor_asignado = cleanVend || buscarVendedorPorTienda(r.tienda || '');
          return {
            tienda:           r.tienda   || '',
            producto:         r.producto || '',
            marca:            r.marca    || '',
            inventario:       r.cantidad || 0,
            venta_promedio:   0,
            vendedor_asignado,
          };
        });

        const misReportes = repsConVendedor
          .filter(r => norm(r.vendedor_asignado) === normNombre)
          .map(r => ({
            tienda:         r.tienda,
            producto:       r.producto,
            marca:          r.marca,
            inventario:     r.inventario,
            venta_promedio: r.venta_promedio,
            vendedor:       r.vendedor_asignado,
          }));

        setReportes(misReportes);
      }

      // 4. Configuracion
      const { data: cfgData } = await sbPortal
        .from('configuracion')
        .select('clave,valor')
        .in('clave', ['inventario','ofertas','inventario_bodega','slides','ventas_resumen','md_vendedores']);

      const cfg = {};
      (cfgData || []).forEach(row => {
        cfg[row.clave] = typeof row.valor === 'string'
          ? (() => { try { return JSON.parse(row.valor); } catch { return row.valor; } })()
          : row.valor;
      });

      const invFiltrado = (cfg.inventario || [])
        .filter(r => norm(r.vendedor) === norm(s.nombre));
      setConfig({ ...cfg, inventario: invFiltrado });

    } catch (err) {
      console.error('Error cargando datos:', err);
      setLoadError('Error al cargar datos. Verifica tu conexión e intenta recargar la página.');
    } finally {
      setLoading(false);
    }
  };

  const logout = async () => {
    try { await sbPortal.auth.signOut(); } catch(e) {}
    clearSession();
    window.location.href = 'index.html';
  };

  if (loading) return (
    <div className="loading-screen">
      <div className="spinner"/>
      <span style={{ fontSize: 14, color: '#6B7280' }}>Cargando…</span>
    </div>
  );

  if (!sesion) return null;

  if (loadError) return (
    <div className="loading-screen" style={{ flexDirection: 'column', gap: 16, padding: 32, textAlign: 'center' }}>
      <div style={{ fontSize: 40 }}>⚠️</div>
      <div style={{ fontSize: 16, fontWeight: 700, color: '#CC0000' }}>Error al cargar</div>
      <div style={{ fontSize: 14, color: '#6B7280', maxWidth: 320 }}>{loadError}</div>
      <button onClick={() => { setLoadError(null); loadData(sesion); }} style={{
        marginTop: 8, background: '#CC0000', color: '#fff', border: 'none',
        borderRadius: 8, padding: '10px 24px', fontSize: 14, cursor: 'pointer', fontFamily: 'DM Sans, sans-serif'
      }}>Reintentar</button>
    </div>
  );

  const tabProps = { reportes, tareas, onUpdateTareas: setTareas, config, onSetTab: setTab, conteoTarea, onConteoTarea: setConteoTarea };
  const nombre1 = (sesion.nombre || '').split(' ')[0];

  return (
    <div className="app-shell">
      {/* Top bar */}
      <div className="topbar">
        <div className="topbar-title">{TAB_TITLES[tab]}</div>
        <button onClick={logout} style={{
          background: 'rgba(255,255,255,0.15)', border: 'none', borderRadius: 8,
          padding: '6px 12px', color: '#fff', fontSize: 12, cursor: 'pointer',
          fontFamily: 'DM Sans, sans-serif', whiteSpace: 'nowrap'
        }}>
          {nombre1} · Salir
        </button>
      </div>

      {/* Contenido */}
      <div className="main-content">
        {repsMsg && (
          <div style={{ margin: '12px 16px 0', padding: '10px 14px', background: '#FFF3CD', border: '1px solid #FFEAA7', borderRadius: 8, fontSize: 13, color: '#856404', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span>⚠️</span><span>{repsMsg}</span>
          </div>
        )}
        {tab === 'inicio'  && <TabInicio  {...tabProps}/>}
        {tab === 'tiendas' && <TabTiendas {...tabProps}/>}
        {tab === 'bodega'  && <TabBodega  {...tabProps}/>}
        {tab === 'ventas'  && <TabVentas  {...tabProps}/>}
        {tab === 'ofertas'  && <TabOfertas  {...tabProps}/>}
        {tab === 'ingresos' && <TabIngresos {...tabProps}/>}
      </div>

      {/* Navegación inferior */}
      <nav className="bottom-nav">
        {TABS.map(t => (
          <button key={t.id}
            className={`nav-btn${tab === t.id ? ' active' : ''}`}
            onClick={() => setTab(t.id)}>
            {ICONS[t.id]}
            <span>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
